# Ryoku palette -> tmux. Rendered by matugen; do not edit.

set -g status-bg                          "#0B0E14"
set -gq @thm_bar_bg                       "#0B0E14"

set -gq @thm_bg                           "#0B0E14"
set -gq @thm_fg                           "#D1D1C7"
set -gq @thm_primary                      "#AAD94C"
set -gq @thm_inverse_primary              "#AAD94C"
set -gq @thm_surface_low                  "#15181f"
set -gq @thm_surface                      "#1E222A"
set -gq @thm_surface_variant              "#32363f"
set -gq @thm_outline                      "#31353d"
set -gq @thm_text_variant                 "#8E959E"

# Re-set the options that read the vars above.
set -g status-style                       "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g window-active-style                "bg=#{@thm_bg},fg=#{@thm_fg}"
